<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1F3B33"/>
      <stop offset="55%" stop-color="#122420"/>
      <stop offset="100%" stop-color="#0B1815"/>
    </radialGradient>

    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FE3C6"/>
      <stop offset="100%" stop-color="#4FD1A5"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="4" y="4" width="192" height="192" rx="46" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="192" height="192" rx="46" fill="none" stroke="#2E5348" stroke-width="1.5" opacity="0.5"/>

  <!-- outer V stroke -->
  <path
    d="M56 62 L100 138 L144 62"
    fill="none"
    stroke="url(#vGrad)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- inner V stroke (offset, creating the layered double-V look) -->
  <path
    d="M70 62 L100 114 L130 62"
    fill="none"
    stroke="url(#vGrad)"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.9"
  />

  <!-- leaf accent, bottom right -->
  <path
    d="M172 158
       C 172 178, 158 190, 140 190
       C 140 172, 152 158, 172 158 Z"
    fill="#4FD1A5"
  />
  <path
    d="M141 189 C 150 179, 160 170, 171 159"
    fill="none"
    stroke="#0B1815"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.35"
  />
</svg>
