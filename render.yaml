# Render Blueprint for Vortex Multi-Agent AI
#
# Deploy: push this file to the repo root, then in the Render Dashboard
# choose "New +" -> "Blueprint" and point it at this repo.
#
# Topology:
#   vortex-frontend  (static site, public)   -> calls vortex-gateway over the public internet
#   vortex-gateway   (web service, public)   -> proxies to the 4 services below over Render's private network
#   vortex-auth      (private service)       -> not reachable from the internet
#   vortex-chat      (private service)       -> not reachable from the internet
#   vortex-agent     (private service)       -> not reachable from the internet
#   vortex-billing   (private service)       -> not reachable from the internet
#   vortex-redis     (Render Key Value)      -> sessions, rate limits, chat memory cache
#
# External dependencies you still need to provision yourself (Render doesn't
# host these): MongoDB (e.g. Atlas), Qdrant (Qdrant Cloud or self-hosted),
# an S3 bucket, a Firebase project, and Razorpay keys. Every var below marked
# "sync: false" will prompt you for a value in the Dashboard on first deploy.

services:
  # ---------------------------------------------------------------------
  # Redis (sessions, rate limiting, short-lived chat memory cache)
  # ---------------------------------------------------------------------
  - type: keyvalue
    name: vortex-redis
    plan: free
    ipAllowList: []            # empty = only reachable from your Render services' private network
    maxmemoryPolicy: allkeys-lru

  # ---------------------------------------------------------------------
  # Gateway — the only backend service exposed publicly
  # ---------------------------------------------------------------------
  - type: web
    name: vortex-gateway
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/gateway/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: FRONTEND_URL
        value: https://vortex-frontend.onrender.com   # update if Render assigns a different subdomain
      - key: REDIS_URL
        fromService:
          name: vortex-redis
          type: keyvalue
          property: connectionString
      - key: AUTH_SERVICE_URL
        value: http://vortex-auth:8001
      - key: CHAT_SERVICE_URL
        value: http://vortex-chat:8002
      - key: AGENT_SERVICE_URL
        value: http://vortex-agent:8003
      - key: BILLING_SERVICE_URL
        value: http://vortex-billing:8004

  # ---------------------------------------------------------------------
  # Auth service — private, only the gateway (and other services) can reach it
  # ---------------------------------------------------------------------
  - type: pserv
    name: vortex-auth
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/services/auth/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8001
      - key: MONGO_URI
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false          # paste the full serviceAccountKey.json contents as one line
      - key: REDIS_URL
        fromService:
          name: vortex-redis
          type: keyvalue
          property: connectionString

  # ---------------------------------------------------------------------
  # Chat service — private
  # ---------------------------------------------------------------------
  - type: pserv
    name: vortex-chat
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/services/chat/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8002
      - key: MONGO_URI
        sync: false

  # ---------------------------------------------------------------------
  # Agent service — private, does the LLM/RAG/tool-calling work
  # ---------------------------------------------------------------------
  - type: pserv
    name: vortex-agent
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/services/agent/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8003
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        fromService:
          name: vortex-redis
          type: keyvalue
          property: connectionString
      - key: AUTH_SERVICE_URL
        value: http://vortex-auth:8001
      - key: QDRANT_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false

  # ---------------------------------------------------------------------
  # Billing service — private
  # ---------------------------------------------------------------------
  - type: pserv
    name: vortex-billing
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/services/billing/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8004
      - key: MONGO_URI
        sync: false
      - key: AUTH_SERVICE_URL
        value: http://vortex-auth:8001
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # ---------------------------------------------------------------------
  # Frontend — static site, public
  # ---------------------------------------------------------------------
  - type: web
    runtime: static
    name: vortex-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        value: https://vortex-gateway.onrender.com     # update if Render assigns a different subdomain
      - key: VITE_FIREBASE_API_KEY
        sync: false
